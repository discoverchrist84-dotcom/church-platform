# Local development stack: Postgres + Redis + web + Celery worker.
#   docker compose up --build
# Then:  docker compose exec web python manage.py migrate
#        docker compose exec web python manage.py seed_demo
#        docker compose exec web python manage.py createsuperuser
x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DEBUG: "True"
    DATABASE_URL: postgres://church:church@db:5432/church
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "False"
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: church
      POSTGRES_DB: church
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info

volumes:
  pgdata:
