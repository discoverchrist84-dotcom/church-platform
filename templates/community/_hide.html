<form method="post" action="{% url 'community:toggle_hidden' slug=branch.slug kind=kind pk=pk %}" class="inline">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button class="btn small ghost" type="submit">{% if hidden %}Unhide{% else %}Hide{% endif %}</button>
</form>
