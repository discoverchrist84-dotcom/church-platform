{% if page.has_other_pages %}
  <nav class="pager" aria-label="Pages">
    {% if page.has_previous %}<a class="btn small ghost" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page.previous_page_number }}">{{ prev_label|default:"← Newer" }}</a>{% else %}<span></span>{% endif %}
    <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn small ghost" href="?{% if qs %}{{ qs }}&amp;{% endif %}page={{ page.next_page_number }}">{{ next_label|default:"Older →" }}</a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
