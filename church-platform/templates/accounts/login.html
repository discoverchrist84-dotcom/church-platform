{% extends "base.html" %}
{% block title %}Sign in · {{ SITE_BRAND }}{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {% include "components/form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn block" type="submit">Sign in</button>
  </form>
  <p class="muted" style="margin-top:1rem">New here? <a href="{% url 'accounts:signup' %}">Create an account</a>.</p>
</section>
{% endblock %}
