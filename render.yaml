# Render Blueprint: New + → Blueprint → pick this repository. Creates the website and its Postgres database.
services:
  - type: web
    name: church-platform
    runtime: docker          # uses the Dockerfile (Python 3.13), so the Python version is never a problem
    plan: free
    healthCheckPath: /offline/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: church-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false          # you type these three in the Render dashboard
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: RUN_IMPORT
        value: "1"           # loads the districts and stations on the first deploy; delete afterwards
databases:
  - name: church-db
    plan: free
